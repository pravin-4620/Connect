name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render Backend /check endpoint
        run: |
          echo "Pinging backend /check at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" https://campusconnect-backend-xang.onrender.com/check)
          echo "Response code: $response"
          
          if [ $response -eq 200 ]; then
            echo "✅ Backend is awake and responding"
          else
            echo "⚠️ Backend returned status: $response"
          fi
